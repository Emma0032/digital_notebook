<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-title">
    <h3>Group 32 Project 2</h3>
    <h1>Notebook</h1>
  </div>
  <span class="tally" id="tally">loading…</span>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2B2A26" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search by title or keyword…">
    <button class="clear-search-btn" id="clearSearchBtn" title="Clear search" aria-label="Clear search">×</button>
  </div>
  <button class="new-btn" id="newBtn">+ New note</button>
</div>

<main>
  <div class="list-pane" id="listPane"></div>
  <div class="editor-pane" id="editorPane"></div>
</main>

<script src="js/script.js"></script>

</body>
</html>
